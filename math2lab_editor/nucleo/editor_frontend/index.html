<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de fórmulas Math2Lab</title>
<style>
  html, body { margin: 0; padding: 0; height: auto; overflow: hidden; background: transparent; font-family: Inter, "Segoe UI", sans-serif; color: #e6e6f0; }
  #contenedor { padding-bottom: 6px; }
  #fila { display: flex; gap: 8px; align-items: stretch; }
  math-field { flex: 1; min-width: 0; font-size: 30px; padding: 10px 14px; background: #12121f; color: #e6e6f0;
               border: 1px solid #00f5ff; border-radius: 10px; box-shadow: 0 0 12px rgba(0,245,255,.35);
               --primary-color: #e6e6f0; --caret-color: #ff2bd6; --selection-background-color: rgba(255,43,214,.35);
               --text-font-family: "Times New Roman", serif; }
  math-field:focus-within { outline: none; border-color: #ff2bd6; box-shadow: 0 0 14px rgba(255,43,214,.7); }
  math-field::part(virtual-keyboard-toggle), math-field::part(menu-toggle) { display: none; }
  #aplicar { background: transparent; color: #00f5ff; border: 1px solid #00f5ff; border-radius: 10px; padding: 0 20px;
             font-size: 15px; cursor: pointer; box-shadow: 0 0 10px rgba(0,245,255,.35); transition: all .2s; }
  #aplicar:hover { background: rgba(0,245,255,.12); box-shadow: 0 0 18px rgba(0,245,255,.85); }
  #estado { font-size: 13px; margin-top: 7px; min-height: 18px; color: #9aa0b8; }
  #estado.pendiente { color: #ff2bd6; }
  #estado.fallo { color: #ff6b6b; }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
</head>
<body>
<div id="contenedor">
<div id="fila">
  <math-field id="mf"></math-field>
  <button id="aplicar" title="Enter">Aplicar ✓</button>
</div>
<div id="estado">Escribe con el teclado: <b>/</b> crea una fracción, <b>^</b> una potencia, <b>sqrt</b> una raíz. Pulsa Enter para aplicar.</div>
</div>

<script>
  const mf = document.getElementById("mf");
  const estado = document.getElementById("estado");
  let pendiente = null, version = null, aplicado = "", listo = false;

  function enviar(tipo, datos) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, datos || {}), "*");
  }
  const contenedor = document.getElementById("contenedor");
  let ultimaAltura = 0;
  function altura() {
    const h = Math.ceil(contenedor.getBoundingClientRect().height);
    if (Math.abs(h - ultimaAltura) < 2) return;          // solo avisa si la altura realmente cambió
    ultimaAltura = h;
    enviar("streamlit:setFrameHeight", { height: h });
  }
  function marcar() {
    if (mf.value !== aplicado) { estado.className = "pendiente"; estado.textContent = "● Cambios sin aplicar: pulsa Enter o «Aplicar»."; }
    else { estado.className = ""; estado.textContent = "Fórmula aplicada."; }
  }
  function poner(latex) {
    if (mf.setValue) mf.setValue(latex); else mf.value = latex;
    aplicado = mf.value;
    marcar();
  }
  function aplicar() {
    aplicado = mf.value;
    marcar();
    enviar("streamlit:setComponentValue", { value: { latex: mf.value, n: Date.now() }, dataType: "json" });
  }
  function sincronizar() {
    if (!pendiente) return;
    if (pendiente.version !== version) { version = pendiente.version; poner(pendiente.latex); }
    altura();
  }

  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") { pendiente = ev.data.args; if (listo) sincronizar(); }
  });

  // =====================================================================================================
  //  TECLADO EN PANTALLA (propio, funciona con LaTeX; reemplaza al teclado nativo del móvil)
  //  Se dibuja pegado al borde inferior de la PÁGINA (no del iframe) y solo aparece al tocar el editor.
  //  Si el navegador no permite salir del iframe, se muestra debajo del editor como alternativa.
  // =====================================================================================================
  // [texto del botón, LaTeX que inserta, ayuda]
  const TECLAS_BARRA = [
    ["a⁄b", "\\frac{#?}{#?}", "Fracción"],
    ["xⁿ", "^{#?}", "Potencia"],
    ["√", "\\sqrt{#?}", "Raíz cuadrada"],
    ["sen", "\\sin\\left(#?\\right)", "Seno"],
    ["cos", "\\cos\\left(#?\\right)", "Coseno"],
    ["tan", "\\tan\\left(#?\\right)", "Tangente"],
    ["ln", "\\ln\\left(#?\\right)", "Logaritmo natural"],
    ["eˣ", "\\exponentialE^{#?}", "e elevado a ..."],
    ["|x|", "\\left|#?\\right|", "Valor absoluto"],
    ["π", "\\pi", "Pi"],
    ["( )", "\\left(#?\\right)", "Paréntesis"],
    ["+", "+", "Suma"],
    ["−", "-", "Resta"],
    ["*", "\\cdot ", "Multiplicación"]
  ];
  const NUMEROS = "1234567890".split("");
  const FILA_Q = "qwertyuiop".split("");
  const FILA_A = "asdfghjkl".split("");
  const FILA_Z = "zxcvbnm".split("");

  const CSS_TECLADO = `
    #m2l-teclado { display: none; background: #0a0a12; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
        font-family: Inter, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation;
        -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    #m2l-teclado.m2l-visible { display: block; }
    #m2l-teclado.m2l-fijo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 999990;
        border-top: 1px solid rgba(0,245,255,.45); box-shadow: 0 -4px 18px rgba(0,245,255,.22); }
    /* animación: el teclado fijo siempre existe, pero sale/entra deslizándose desde el borde inferior */
    #m2l-teclado.m2l-fijo { display: block; transform: translateY(100%); visibility: hidden; pointer-events: none;
        transition: transform .22s ease-out, visibility 0s linear .22s; will-change: transform; }
    #m2l-teclado.m2l-fijo.m2l-visible { transform: translateY(0); visibility: visible; pointer-events: auto;
        transition: transform .22s ease-out, visibility 0s; }
    @media (prefers-reduced-motion: reduce) {
      #m2l-teclado.m2l-fijo, #m2l-teclado.m2l-fijo.m2l-visible { transition: none; }
    }
    #m2l-teclado.m2l-embebido { position: static; margin-top: 8px; border-radius: 10px; border: 1px solid rgba(0,245,255,.3); }
    #m2l-teclado .m2l-in { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
    #m2l-teclado .m2l-fila { display: flex; gap: 6px; }
    #m2l-teclado .m2l-barra { display: grid; grid-template-columns: repeat(14, 1fr); }
    #m2l-teclado .m2l-k { flex: 1 1 0; min-width: 0; height: 40px; margin: 0; padding: 0; background: #12121f; color: #b6ff3b;
        border: 1px solid rgba(182,255,59,.45); border-radius: 6px; font: 400 15px Inter, "Segoe UI", sans-serif;
        cursor: pointer; transition: all .15s; line-height: 1; }
    #m2l-teclado .m2l-k:active { background: rgba(182,255,59,.3); box-shadow: 0 0 8px rgba(182,255,59,.6); }
    #m2l-teclado .m2l-ancha { flex: 0 0 22%; }
    #m2l-teclado .m2l-ap { color: #00f5ff; border-color: #00f5ff; box-shadow: 0 0 10px rgba(0,245,255,.35); }
    #m2l-teclado .m2l-ap:active { background: rgba(0,245,255,.25); box-shadow: 0 0 18px rgba(0,245,255,.85); }
    @media (hover: hover) {
      #m2l-teclado .m2l-k:hover { background: rgba(182,255,59,.15); box-shadow: 0 0 8px rgba(182,255,59,.6); }
      #m2l-teclado .m2l-ap:hover { background: rgba(0,245,255,.12); box-shadow: 0 0 18px rgba(0,245,255,.85); }
    }
    @media (max-width: 600px) {
      #m2l-teclado .m2l-k { height: 38px; font-size: 14px; }
    }
    @media (max-width: 600px) and (min-height: 501px) {
      #m2l-teclado .m2l-barra { grid-template-columns: repeat(7, 1fr); }
    }
    @media (max-height: 500px) {              /* pantalla baja (móvil en horizontal): teclado compacto */
      #m2l-teclado { padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
      #m2l-teclado .m2l-in, #m2l-teclado .m2l-fila { gap: 4px; }
      #m2l-teclado .m2l-k { height: 30px; font-size: 13px; border-radius: 5px; }
    }`;

  // ¿Podemos dibujar el teclado en la página que contiene al iframe? (mismo origen en Streamlit)
  let P = null;
  try { P = window.parent && window.parent.document && window.parent.document.body ? window.parent.document : null; } catch (e) { P = null; }
  const doc = P || document;

  let teclado = null, estiloTeclado = null, visible = false, tocandoHasta = 0;
  let temporizador = null, repeticion = null, intervaloLateral = null;

  function sinTecladoNativo() {          // evita que salga Gboard encima del teclado propio
    try { mf.setAttribute("inputmode", "none"); } catch (e) {}
    try {
      if (mf.shadowRoot) mf.shadowRoot.querySelectorAll("textarea, [contenteditable]").forEach(function (el) { el.setAttribute("inputmode", "none"); });
    } catch (e) {}
  }
  function ejecutar(fn) {
    if (!listo) return;
    fn();
    mf.focus();
    marcar();
  }
  function insertar(latex) { return function () { mf.insert(latex); }; }
  function comando(nombre) { return function () { mf.executeCommand(nombre); }; }
  function detenerRepeticion() { clearTimeout(temporizador); clearInterval(repeticion); temporizador = repeticion = null; }

  function crearTecla(texto, accion, opc) {
    opc = opc || {};
    const b = doc.createElement("button");
    b.type = "button";
    b.className = "m2l-k" + (opc.clase ? " " + opc.clase : "");
    b.textContent = texto;
    if (opc.ayuda) { b.title = opc.ayuda; b.setAttribute("aria-label", opc.ayuda); }
    // pointerdown + preventDefault: la tecla actúa al instante y NO le quita el foco al editor
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      tocandoHasta = Date.now() + 500;
      ejecutar(accion);
      if (opc.repetir) {                 // mantener pulsado = repetir (útil para borrar)
        detenerRepeticion();
        temporizador = setTimeout(function () { repeticion = setInterval(function () { ejecutar(accion); }, 70); }, 380);
      }
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, detenerRepeticion); });
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    return b;
  }

  function montarTeclado() {
    const destino = P ? P.head : document.head;
    if (P) {                              // limpia restos de una carga anterior del componente
      ["m2l-teclado", "m2l-teclado-css"].forEach(function (id) { const v = P.getElementById(id); if (v) v.remove(); });
    }
    estiloTeclado = doc.createElement("style");
    estiloTeclado.id = "m2l-teclado-css";
    estiloTeclado.textContent = CSS_TECLADO;
    destino.appendChild(estiloTeclado);

    teclado = doc.createElement("div");
    teclado.id = "m2l-teclado";
    teclado.className = P ? "m2l-fijo" : "m2l-embebido";
    const dentro = doc.createElement("div");
    dentro.className = "m2l-in";
    teclado.appendChild(dentro);
    function fila(clase) { const f = doc.createElement("div"); f.className = "m2l-fila" + (clase ? " " + clase : ""); dentro.appendChild(f); return f; }

    // Fila 1: la barra de 11 botones + los signos + − *
    const f1 = fila("m2l-barra");
    TECLAS_BARRA.forEach(function (t) { f1.appendChild(crearTecla(t[0], insertar(t[1]), { ayuda: t[2] })); });
    // Fila 2: números 1 … 0
    const f2 = fila();
    NUMEROS.forEach(function (n) { f2.appendChild(crearTecla(n, insertar(n))); });
    // Filas 3-5: letras en disposición QWERTY
    const f3 = fila();
    FILA_Q.forEach(function (c) { f3.appendChild(crearTecla(c, insertar(c))); });
    const f4 = fila();
    FILA_A.forEach(function (c) { f4.appendChild(crearTecla(c, insertar(c))); });
    f4.appendChild(crearTecla("⌫", comando("deleteBackward"), { clase: "m2l-ancha", ayuda: "Borrar", repetir: true }));
    const f5 = fila();
    FILA_Z.forEach(function (c) { f5.appendChild(crearTecla(c, insertar(c))); });
    f5.appendChild(crearTecla("◀", comando("moveToPreviousChar"), { ayuda: "Mover cursor a la izquierda", repetir: true }));
    f5.appendChild(crearTecla("▶", comando("moveToNextChar"), { ayuda: "Mover cursor a la derecha", repetir: true }));
    f5.appendChild(crearTecla("Aplicar ✓", function () {}, { clase: "m2l-ancha m2l-ap", ayuda: "Aplicar la fórmula" }));
    // «Aplicar» del teclado: aplica y cierra el teclado para que se vea el resultado
    const botonAplicar = f5.lastChild;
    botonAplicar.addEventListener("pointerdown", function () { if (!listo) return; aplicar(); ocultar(); mf.blur(); });

    (P ? P.body : contenedor).appendChild(teclado);
  }

  function reservarEspacio(activo) {      // que el teclado no tape el final de la página
    if (!P) return;
    const principal = P.querySelector('[data-testid="stMain"]') || P.querySelector("section.main");
    if (principal) {
      principal.style.transition = "padding-bottom .22s ease-out";
      principal.style.paddingBottom = activo ? teclado.offsetHeight + "px" : "";
    }
  }
  // El teclado es de ancho completo y la barra lateral de Streamlit se dibuja ENCIMA (z-index mayor): si el usuario la
  // ensancha, tapaba la parte izquierda del teclado. Por eso el teclado empieza justo donde termina la barra lateral
  // (y se centra en el resto de la pantalla). Si la barra está contraída, queda fuera de pantalla y el teclado ocupa todo.
  function ajustarIzquierda() {
    if (!P || !teclado) return;
    let izq = 0;
    try {
      const lateral = P.querySelector('[data-testid="stSidebar"]');
      // En pantallas estrechas (celular) la barra lateral es un panel que se superpone: se ignora
      if (lateral && P.defaultView.innerWidth > 640) {
        const r = lateral.getBoundingClientRect();
        if (r.width > 0 && r.right > 0) izq = Math.round(r.right);
      }
    } catch (e) {}
    if (teclado.style.left !== izq + "px") teclado.style.left = izq + "px";
  }
  function mostrar() {
    if (visible || !teclado) return;
    visible = true;
    teclado.classList.add("m2l-visible");
    ajustarIzquierda();
    clearInterval(intervaloLateral);
    intervaloLateral = setInterval(ajustarIzquierda, 120);     // mientras está abierto, sigue a la barra lateral si cambia de ancho
    reservarEspacio(true);
    asegurarVisible();
    altura();
  }
  function asegurarVisible() {            // sube/baja la página para que el editor quede justo encima del teclado
    if (!P) return;
    setTimeout(function () {
      try {
        const marco = window.frameElement;
        if (!marco || !visible) return;
        const vista = P.defaultView, r = marco.getBoundingClientRect();
        const limite = vista.innerHeight - teclado.offsetHeight - 8;
        let d = Math.max(0, r.bottom - limite);          // cuánto tapa el teclado al editor
        if (r.top - d < 8) d = r.top - 8;                // si no cabe todo, prioriza ver la parte de arriba
        if (Math.abs(d) < 2) return;
        const cont = P.querySelector('[data-testid="stMain"]') || P.querySelector("section.main");
        if (cont && cont.scrollHeight > cont.clientHeight) cont.scrollBy({ top: d, behavior: "smooth" });
        else vista.scrollBy({ top: d, behavior: "smooth" });
      } catch (e) {}
    }, 80);
  }
  function alCambiarTamano() {            // al girar el dispositivo el teclado cambia de tamaño: recalcular
    if (!visible) return;
    setTimeout(function () { ajustarIzquierda(); reservarEspacio(true); asegurarVisible(); }, 120);
  }
  function ocultar() {
    if (!visible || !teclado) return;
    visible = false;
    teclado.classList.remove("m2l-visible");
    clearInterval(intervaloLateral);
    reservarEspacio(false);
    altura();
  }
  function revisarFoco() {                // oculta el teclado cuando el usuario toca fuera del editor
    setTimeout(function () {
      if (Date.now() < tocandoHasta) return;
      if (!document.hasFocus() || document.activeElement !== mf) ocultar();
    }, 200);
  }
  function tocoFuera(e) {                 // tocar cualquier parte de la página (fuera del editor y del teclado) lo cierra
    if (teclado && teclado.contains(e.target)) return;
    if (window.frameElement && window.frameElement.contains(e.target)) return;
    ocultar();
  }
  function retirarTeclado() {
    try {
      detenerRepeticion(); clearInterval(intervaloLateral); reservarEspacio(false);
      if (P) { P.removeEventListener("pointerdown", tocoFuera, true); P.defaultView.removeEventListener("resize", alCambiarTamano); }
      if (teclado) teclado.remove(); if (estiloTeclado) estiloTeclado.remove();
    } catch (e) {}
  }

  montarTeclado();
  if (P) { P.addEventListener("pointerdown", tocoFuera, true); P.defaultView.addEventListener("resize", alCambiarTamano); }
  window.addEventListener("pagehide", retirarTeclado);
  window.addEventListener("blur", revisarFoco);
  mf.addEventListener("focusin", function () { sinTecladoNativo(); mostrar(); });
  mf.addEventListener("click", function () { sinTecladoNativo(); mostrar(); });
  mf.addEventListener("focusout", revisarFoco);

  customElements.whenDefined("math-field").then(function () {
    mf.mathVirtualKeyboardPolicy = "manual";
    sinTecladoNativo();
    mf.addEventListener("input", marcar);
    mf.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); aplicar(); } }, true);
    listo = true;
    sincronizar();
  });

  document.getElementById("aplicar").addEventListener("click", aplicar);

  setTimeout(function () {
    if (!customElements.get("math-field")) {
      estado.className = "fallo";
      estado.textContent = "No se pudo cargar el editor visual (revisa tu conexión a internet). Usa «Escribir como texto» más abajo.";
      altura();
    }
  }, 8000);

  new ResizeObserver(altura).observe(contenedor);
  enviar("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
